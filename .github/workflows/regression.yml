name: regression

on:
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

# Public repository, standard Linux runners only. No signing, publishing, secrets,
# privileged PR trigger, write token, or build-artifact promotion.
permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter and editor regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.1'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: false
      - name: Run all Flutter, Rust and signing-helper fixture tests
        run: bash tools/check-regressions.sh flutter

  core:
    name: Go core regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.1'
          cache: false
      - name: Run core tests, race detector, vet and gVisor-tagged tests
        run: bash tools/check-regressions.sh core
