name: android-apk

on:
  workflow_dispatch:
    inputs:
      debug_preview:
        description: 'Allow a debug-signed preview if release signing is not configured (never a stable release)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK_VERSION="28.2.13676358"
          if [ -z "${ANDROID_SDK_ROOT:-}" ]; then
            echo "ANDROID_SDK_ROOT is not set"
            exit 1
          fi
          set +o pipefail
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}"
          set -o pipefail
          if [ ! -d "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" ]; then
            echo "NDK ${NDK_VERSION} was not installed"
            exit 1
          fi
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Setup Keystore
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALLOW_DEBUG_PREVIEW: ${{ inputs.debug_preview }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE}" ] || [ -z "${KEY_ALIAS}" ] || [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ]; then
            if [ "${ALLOW_DEBUG_PREVIEW}" != "true" ]; then
              echo "::error::Release signing is not configured. Refusing debug-signature fallback."
              exit 1
            fi
            echo "::warning::Explicit debug preview: this APK is not signed with a production key."
            echo "BETTBOX_ALLOW_DEBUG_PREVIEW=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "${KEYSTORE}" | base64 --decode > android/app/keystore.jks
          keytool -list -keystore android/app/keystore.jks -alias "${KEY_ALIAS}" -storepass:env STORE_PASSWORD >/dev/null
          python3 tools/write-signing-properties.py

      - name: Build universal APK
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart run build_runner build -d
          dart setup.dart android --arch universal --env stable
          ls -lh dist || true
          find dist -name '*.apk' -print

      - name: Verify production APK signatures
        if: env.BETTBOX_ALLOW_DEBUG_PREVIEW != 'true'
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"
          python3 tools/verify-android-release.py --apksigner "$apksigner" dist/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bettbox-android-universal
          path: dist/**/*.apk
          if-no-files-found: error
          retention-days: 14
