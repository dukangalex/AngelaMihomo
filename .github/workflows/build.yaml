name: build

on:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - 'release/**'

env:
  # AngelaMihomo fork: '-chain.' tags are stable fork releases
  IS_STABLE: ${{ startsWith(github.ref, 'refs/tags/v') && (!contains(github.ref, '-') || contains(github.ref_name, '-chain.')) }}
  IS_PRERELEASE: ${{ contains(github.ref_name, 'pre') }}
  SHOULD_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && (!contains(github.ref, '-') || contains(github.ref_name, 'pre') || contains(github.ref_name, '-chain.')) }}
  GRADLE_OPTS: -Dorg.gradle.vfs.watch=false
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SENTRY_BACKEND: none
  # Temporarily disabled SignPath due to account risk control:
  # SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
  SIGNPATH_API_TOKEN: ''
  
# Default token scope for every job; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify tag matches pubspec version
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Not a version tag push (${GITHUB_REF}); skipping version check."
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          tag="${tag%-pre[0-9]*}"
          ver="$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/^version:[[:space:]]*//' | sed 's/+.*//')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version ${ver}; bump pubspec.yaml before tagging."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches pubspec version ${ver}."

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Select build matrix
        id: set-matrix
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            cat > /tmp/matrix.json <<'JSON'
          {"include":[{"platform":"android","os":"ubuntu-24.04","arch":"arm64"},{"platform":"android","os":"ubuntu-24.04","arch":"amd64"},{"platform":"android","os":"ubuntu-24.04","arch":"arm"},{"platform":"android","os":"ubuntu-24.04","arch":"universal"},{"platform":"windows","os":"windows-2022","arch":"amd64"},{"platform":"windows","os":"windows-11-arm","arch":"arm64"},{"platform":"windows","os":"windows-2022","arch":"amd64","compatible":true},{"platform":"macos","os":"macos-26","arch":"arm64"},{"platform":"macos","os":"macos-26","arch":"amd64"},{"platform":"linux","os":"ubuntu-22.04","arch":"amd64"},{"platform":"linux","os":"ubuntu-24.04-arm","arch":"arm64"},{"platform":"linux","os":"ubuntu-22.04","arch":"amd64","compatible":true}]}
          JSON
          else
            cat > /tmp/matrix.json <<'JSON'
          {"include":[{"platform":"android","os":"ubuntu-24.04","arch":"arm64"},{"platform":"android","os":"ubuntu-24.04","arch":"amd64"},{"platform":"android","os":"ubuntu-24.04","arch":"arm"},{"platform":"android","os":"ubuntu-24.04","arch":"universal"}]}
          JSON
          fi
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: [version-guard, prepare]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Rust (Windows)
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}

      - name: Setup Rust (Android)
        if: matrix.platform == 'android'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Rust (Linux)
        if: matrix.platform == 'linux'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Setup Rust (macOS)
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.arch == 'amd64' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin' }}

      - name: Enable Git long paths (Windows)
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Setup Keystore (Android)
        if: matrix.platform == 'android'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALLOW_DEBUG_PREVIEW: ${{ contains(github.ref_name, 'pre') }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE}" ] || [ -z "${KEY_ALIAS}" ] || [ -z "${STORE_PASSWORD}" ] || [ -z "${KEY_PASSWORD}" ]; then
            if [ "${ALLOW_DEBUG_PREVIEW}" != "true" ]; then
              echo "::error::Stable Android releases require KEYSTORE, KEY_ALIAS, STORE_PASSWORD and KEY_PASSWORD. Refusing debug-signature fallback."
              exit 1
            fi
            echo "::warning::No complete release keystore. This prerelease APK uses a debug signature, not a production signing key."
            echo "BETTBOX_ALLOW_DEBUG_PREVIEW=true" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "${KEYSTORE}" | base64 --decode > android/app/keystore.jks
          keytool -list -keystore android/app/keystore.jks -alias "${KEY_ALIAS}" -storepass:env STORE_PASSWORD >/dev/null
          python3 tools/write-signing-properties.py
          
      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        if: matrix.platform == 'android'
        shell: bash
        run: |
          NDK_VERSION="28.2.13676358"
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" >/dev/null 2>&1 || true
          echo "ANDROID_NDK=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Configure Cargo for Android
        if: matrix.platform == 'android'
        shell: bash
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          [target.armv7-linux-androideabi]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang"
          [target.x86_64-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          [target.i686-linux-android]
          linker = "${ANDROID_NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android26-clang"
          EOF

      - name: Install Dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::ForceIPv4=true
          sudo apt-get install -y -o Acquire::Retries=3 -o Acquire::ForceIPv4=true --fix-missing libcurl4-openssl-dev ninja-build libgtk-3-dev rpm

      - name: Setup Golang
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.compatible == true && '1.24.x' || '1.25.x' }}
          cache-dependency-path: core/go.sum

      - name: Select Xcode (macOS)
        if: matrix.platform == 'macos'
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ contains(matrix.os, 'arm') && 'master' || 'stable' }}
          cache: true
          cache-key: flutter-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('**/pubspec.lock') }}
          flutter-version: ${{ contains(matrix.os, 'arm') && '' || '3.47.7' }}

      - name: Clear Pub Cache Credentials
        shell: bash
        run: rm -f ~/.pub-cache/credentials.json 2>/dev/null || true


      - name: Clean Gradle (Android)
        if: matrix.platform == 'android'
        run: |
          cd android
          flutter clean

      - name: Disable Swift Package Manager (macOS)
        if: matrix.platform == 'macos'
        run: flutter config --no-enable-swift-package-manager

      - name: Patch for Windows
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          cd core
          SING_TUN_VERSION=$(grep -E 'github\.com/metacubex/sing-tun\s+v[^[:space:]]+' go.mod | awk '{print $2}')
          echo "Detected sing-tun version: ${SING_TUN_VERSION}"
          go mod download github.com/metacubex/sing-tun@${SING_TUN_VERSION}
          MOD_CACHE=$(go env GOMODCACHE | tr '\\' '/')
          FILE="${MOD_CACHE}/github.com/metacubex/sing-tun@${SING_TUN_VERSION}/tun_windows.go"
          echo "Patching ${FILE}"
          chmod +w "${FILE}"
      - name: Build AngelaMihomo (Non-Windows)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build
          dart setup.dart ${{ matrix.platform }} --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} ${{ matrix.compatible == true && '--compatible' || '' }}

      - name: Verify production APK signatures
        if: matrix.platform == 'android' && env.BETTBOX_ALLOW_DEBUG_PREVIEW != 'true'
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$apksigner"
          python3 tools/verify-android-release.py --apksigner "$apksigner" dist/*.apk

      - name: Install SignPath (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ env.SIGNPATH_API_TOKEN }}
        run: |
          if (-not $env:SIGNPATH_API_TOKEN) {
            Write-Host "SIGNPATH_API_TOKEN is not configured. Skipping module installation."
            exit 0
          }
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
          Install-Module -Name SignPath -Force -Scope CurrentUser -Repository PSGallery

      - name: Set Signing Policy Slug (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $isStable = '${{ env.IS_STABLE }}' -eq 'true'
          $isPre = '${{ env.IS_PRERELEASE }}' -eq 'true'

          if ($isStable) {
            $exePolicy = "release-signing"
            $installerPolicy = "release-signing"
          } elseif ($isPre) {
            $exePolicy = "test-signing"
            $installerPolicy = "release-signing"
          } else {
            $exePolicy = "test-signing"
            $installerPolicy = "test-signing"
          }
          Write-Host "Setting EXE_SIGNING_POLICY_SLUG to $exePolicy"
          Write-Host "Setting INSTALLER_SIGNING_POLICY_SLUG to $installerPolicy"
          "EXE_SIGNING_POLICY_SLUG=$exePolicy" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_SIGNING_POLICY_SLUG=$installerPolicy" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Core (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          flutter pub get
          dart run build_runner build
          dart setup.dart windows --arch ${{ matrix.arch }} --out core-only ${{ matrix.compatible == true && '--compatible' || '' }}

      - name: Upload Unsigned Core
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-core
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-core-${{ matrix.arch }}-${{ matrix.compatible }}
          path: libclash/windows/AngelaMihomoCore.exe
          if-no-files-found: error
          retention-days: 1

      - name: Wait for Unsigned Core
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/wait-artifact.sh '${{ steps.upload-core.outputs.artifact-id }}'

      - name: Sign Core (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        timeout-minutes: 60
        with:
          api-token: '${{ env.SIGNPATH_API_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          organization-id: '0d3f8e8e-3f4d-4ac8-ab3f-d6c5c110ab0d'
          project-slug: 'AngelaMihomo'
          signing-policy-slug: '${{ env.EXE_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-core.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'libclash/windows'

      - name: Build HelperService (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $signedCoreHash = (Get-FileHash libclash/windows/AngelaMihomoCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Signed Core SHA256 (TOKEN for Helper): $signedCoreHash"
          dart setup.dart windows --arch ${{ matrix.arch }} --out helper --core-hash $signedCoreHash ${{ matrix.compatible == true && '--compatible' || '' }}

      - name: Upload Unsigned HelperService
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-helper
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-helper-${{ matrix.arch }}-${{ matrix.compatible }}
          path: libclash/windows/AngelaMihomoHelperService.exe
          if-no-files-found: error
          retention-days: 1

      - name: Wait for Unsigned HelperService
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/wait-artifact.sh '${{ steps.upload-helper.outputs.artifact-id }}'

      - name: Sign HelperService (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        timeout-minutes: 60
        with:
          api-token: '${{ env.SIGNPATH_API_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          organization-id: '0d3f8e8e-3f4d-4ac8-ab3f-d6c5c110ab0d'
          project-slug: 'AngelaMihomo'
          signing-policy-slug: '${{ env.EXE_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-helper.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'libclash/windows'

      - name: Build AngelaMihomo (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $coreHash = (Get-FileHash libclash/windows/AngelaMihomoCore.exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Core SHA256: $coreHash"
          
          $desc = if ('${{ matrix.compatible }}' -eq 'true') { "${{ matrix.arch }}-compatible" } else { "${{ matrix.arch }}" }
          $appEnv = if ('${{ env.IS_STABLE }}' -eq 'true') { "stable" } else { "pre" }
          
          $flutterArgs = @(
            "build", "windows", "--release", "--verbose",
            "--dart-define=CORE_SHA256=$coreHash",
            "--dart-define=APP_ENV=$appEnv",
            "--dart-define=APP_ASSET_SUFFIX=windows-$desc-setup.exe"
          )
          
          flutter @flutterArgs

      - name: Upload Unsigned AngelaMihomo
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-bettbox
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-bettbox-${{ matrix.arch }}-${{ matrix.compatible }}
          path: build/windows/${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}/runner/Release/AngelaMihomo.exe
          if-no-files-found: error
          retention-days: 1

      - name: Wait for Unsigned AngelaMihomo
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/wait-artifact.sh '${{ steps.upload-bettbox.outputs.artifact-id }}'

      - name: Sign AngelaMihomo (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        timeout-minutes: 60
        with:
          api-token: '${{ env.SIGNPATH_API_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          organization-id: '0d3f8e8e-3f4d-4ac8-ab3f-d6c5c110ab0d'
          project-slug: 'AngelaMihomo'
          signing-policy-slug: '${{ env.EXE_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-bettbox.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'build/windows/${{ matrix.arch == ''arm64'' && ''arm64'' || ''x64'' }}/runner/Release'

      - name: Package Windows Application
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          dart windows/packaging/exe/package_windows.dart --arch ${{ matrix.arch }} ${{ matrix.compatible == true && '--compatible' || '' }} --env ${{ env.IS_STABLE == 'true' && 'stable' || 'pre' }}

      - name: Find Installer Path
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $desc = if ('${{ matrix.compatible }}' -eq 'true') { "${{ matrix.arch }}-compatible" } else { "${{ matrix.arch }}" }
          $installer = (Resolve-Path "dist/AngelaMihomo-*-windows-$desc-setup.exe").Path
          echo "INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "INSTALLER_FILENAME=$(Split-Path -Leaf $installer)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Unsigned Installer
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        id: upload-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-installer-${{ matrix.arch }}-${{ matrix.compatible }}
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Wait for Unsigned Installer
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/wait-artifact.sh '${{ steps.upload-installer.outputs.artifact-id }}'

      - name: Sign Installer (Windows)
        if: matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2
        timeout-minutes: 60
        with:
          api-token: '${{ env.SIGNPATH_API_TOKEN }}'
          github-token: '${{ secrets.GITHUB_TOKEN }}'
          organization-id: '0d3f8e8e-3f4d-4ac8-ab3f-d6c5c110ab0d'
          project-slug: 'AngelaMihomo'
          signing-policy-slug: '${{ env.INSTALLER_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-installer.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: 'dist'
      
      - name: Clean up intermediate unsigned artifacts
        if: always() && matrix.platform == 'windows' && env.SIGNPATH_API_TOKEN != ''
        continue-on-error: true
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6
        with:
          name: |
            unsigned-core-${{ matrix.arch }}-${{ matrix.compatible }}
            unsigned-helper-${{ matrix.arch }}-${{ matrix.compatible }}
            unsigned-bettbox-${{ matrix.arch }}-${{ matrix.compatible }}
            unsigned-installer-${{ matrix.arch }}-${{ matrix.compatible }}
          failOnError: false
      

      - name: Upload Artifacts (macOS & Android)
        if: matrix.platform != 'linux' && matrix.platform != 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AngelaMihomo-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}
          path: ./dist/*
          archive: false
          overwrite: true

      - name: Upload Windows Installer Artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AngelaMihomo-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}-installer
          path: ./dist/*.exe
          archive: false
          overwrite: true

      - name: Upload Windows Portable Artifact
        if: matrix.platform == 'windows' && matrix.compatible == true && matrix.arch == 'amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AngelaMihomo-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}-portable
          path: ./dist/*.zip
          archive: false
          overwrite: true

      - name: Upload DEB Artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AngelaMihomo-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}-deb
          path: ./dist/*.deb
          archive: false
          overwrite: true

      - name: Upload AppImage Artifact
        if: matrix.platform == 'linux' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AngelaMihomo-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}-AppImage
          path: ./dist/*.AppImage
          archive: false
          overwrite: true

      - name: Upload RPM Artifact
        if: matrix.platform == 'linux' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: AngelaMihomo-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.compatible == true && '-compatible' || '' }}-rpm
          path: ./dist/*.rpm
          archive: false
          overwrite: true

  upload:
    if: startsWith(github.ref, 'refs/tags/v')
    # Least privilege: create/update the GitHub Release and read this run's
    # artifacts. Nothing else in this job needs the token.
    permissions:
      contents: write
      actions: read
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ./dist/
          pattern: AngelaMihomo-*
          merge-multiple: true
          skip-decompress: true

      - name: Generate release.md
        run: |
          printf '%s\n' "- Fixes and improvements" "- Recommended version update" > release.md

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          base_version=$(echo "$version" | sed 's/-pre[0-9]*//')
          if [ "${{ env.IS_PRERELEASE }}" == "true" ]; then
            sed -e "s|BASE_VERSION|$base_version|g" -e "s|VERSION|$version|g" ./.github/release_template_pre.md >> release.md
          else
            sed -e "s|BASE_VERSION|$base_version|g" -e "s|VERSION|$version|g" ./.github/release_template.md >> release.md
          fi

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        if: ${{ env.SHOULD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: ./dist/*
          body_path: './release.md'
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}

      - name: Notify Telegram channel
        if: ${{ env.SHOULD_RELEASE == 'true' && success() }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_CHANNEL_ID" ]; then
            echo "::warning::Telegram secrets not configured, skipping channel announcement"
            exit 0
          fi
          if [ -s ./.github/release_highlights.txt ]; then
            HIGHLIGHTS="$(cat ./.github/release_highlights.txt)"
          else
            HIGHLIGHTS="Fixes and improvements · 建议更新到此版本"
          fi
          MSG="🎉 Angela Mihomo ${{ github.ref_name }} 发布

          ${HIGHLIGHTS}

          下载：https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHANNEL_ID}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "link_preview_options={\"url\":\"https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}\"}" \
            -o /tmp/tg_resp.json -w 'HTTP %{http_code}\n'
          cat /tmp/tg_resp.json
          grep -q '"ok":true' /tmp/tg_resp.json
