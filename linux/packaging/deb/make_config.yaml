postinstall_scripts:
  - |
    CORE_PATH="/usr/share/AngelaMihomo/AngelaMihomoCore"
    if [ -f "$CORE_PATH" ]; then
      setcap 'cap_net_admin,cap_net_bind_service,cap_net_raw=+ep' "$CORE_PATH" && sync
    fi
    rm -f /etc/polkit-1/rules.d/90-bettbox.rules /etc/polkit-1/rules.d/99-bettbox.rules /usr/share/polkit-1/rules.d/99-bettbox.rules
